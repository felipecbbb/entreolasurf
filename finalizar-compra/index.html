<!doctype html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" type="image/png" href="/favicon.png"><title>Finalizar compra | Entre Olas</title><meta name="description" content="Página de checkout de Entre Olas."><link rel="stylesheet" href="/style.css"></head>
<body class="internal-page no-hero">
<main>
  <section class="section" style="padding-top:120px">
    <div class="container">
      <div class="page-intro">
        <p class="kicker">Finalizar compra</p>
        <h1 class="title">Checkout</h1>
      </div>
      <div id="guest-bar" class="guest-bar" style="display:none;margin-bottom:20px">
        ¿Ya tienes cuenta? <a href="/mi-cuenta/">Inicia sesión</a> para pre-rellenar tus datos, o continúa como invitado.
      </div>
      <div class="checkout-grid">
        <div id="checkout-form-wrap">
          <form id="co-form" class="checkout-form">
            <label>Nombre completo <input type="text" name="nombre" required></label>
            <label>Email <input type="email" name="email" required></label>
            <label>Teléfono <input type="tel" name="telefono" required></label>

            <p class="co-section-title">Dirección de envío</p>
            <label>Dirección <input type="text" name="direccion" required></label>
            <div class="row-2">
              <label>Ciudad <input type="text" name="ciudad" required></label>
              <label>Código postal <input type="text" name="cp" required></label>
            </div>
            <label>Notas del pedido <textarea name="notas" placeholder="Indicaciones especiales, tallas, etc."></textarea></label>

            <label class="co-invoice-toggle">
              <input type="checkbox" name="quiere_factura" id="co-invoice-check">
              <span>Quiero factura</span>
            </label>
            <div id="co-invoice-fields" class="co-invoice-fields" hidden>
              <label>Nombre o razón social <input type="text" name="factura_nombre"></label>
              <label>NIF / CIF <input type="text" name="factura_nif"></label>
              <label>Dirección fiscal <input type="text" name="factura_direccion" placeholder="Si es distinta a la de envío"></label>
            </div>

            <button type="submit" class="btn red" style="width:100%;margin-top:8px">Pagar con tarjeta</button>
            <p style="text-align:center;font-size:.78rem;color:var(--color-muted);margin-top:8px">
              <svg style="vertical-align:middle;margin-right:4px" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
              Pago seguro con Stripe
            </p>
          </form>
        </div>
        <div id="checkout-summary" class="order-summary-card"></div>
      </div>
    </div>
  </section>
</main>
<script type="module" src="/finalizar-compra/checkout.js"></script>
</body></html>
