<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="/favicon.png">
  <title>Tienda | Entre Olas</title>
  <meta name="description" content="Tienda de Entre Olas: productos y ediciones especiales de nuestra escuela de surf.">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/tienda-2/tienda.css">
</head>
<body class="internal-page">

<main>
  <!-- Hero -->
  <section class="shop-hero">
    <div class="shop-hero-bg"></div>
    <div class="shop-hero-content">
      <span class="shop-hero-tag">Tienda</span>
      <h1>Lleva el mar contigo</h1>
      <p>Productos exclusivos de Entre Olas. Ediciones limitadas, hechas con sal y pasión.</p>
    </div>
  </section>

  <!-- Category filter -->
  <section class="shop-filters">
    <div class="container">
      <div class="shop-filter-bar">
        <button class="shop-filter-pill active" data-cat="all">Todo</button>
      </div>
    </div>
  </section>

  <!-- Products grid -->
  <section class="shop-products">
    <div class="container">
      <div id="shop-grid" class="shop-grid">
        <!-- Skeleton loading -->
        <div class="shop-card shop-card-skeleton"><div class="shop-card-img skeleton-shimmer"></div><div class="shop-card-body"><div class="skeleton-line w70"></div><div class="skeleton-line w40"></div></div></div>
        <div class="shop-card shop-card-skeleton"><div class="shop-card-img skeleton-shimmer"></div><div class="shop-card-body"><div class="skeleton-line w70"></div><div class="skeleton-line w40"></div></div></div>
        <div class="shop-card shop-card-skeleton"><div class="shop-card-img skeleton-shimmer"></div><div class="shop-card-body"><div class="skeleton-line w70"></div><div class="skeleton-line w40"></div></div></div>
      </div>
      <div id="shop-empty" class="shop-empty" style="display:none">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
        <p>No hay productos disponibles en este momento.</p>
      </div>
    </div>
  </section>
</main>


<script type="module" src="/app.js"></script>
<script type="module" src="/tienda-2/tienda.js"></script>
</body>
</html>
